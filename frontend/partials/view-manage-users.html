<!-- frontend/partials/view-manage-users.html -->

<section id="view-manage-users" class="view d-none">

  <!-- User Management -->
  <section class="card p-3">
    <h2>User Management</h2>

    <form id="userForm">

      <!-- Add/Edit User -->
      <div class="row g-2">
        <div class="col-md-4">
          <label for="userName" class="form-label">Name</label>
          <input
            type="text"
            id="userName"
            class="form-control"
            placeholder="e.g., John Doe"
          />
        </div>

        <div class="col-md-4">
          <label for="userEmail" class="form-label">Email</label>
          <input
            type="email"
            id="userEmail"
            class="form-control"
            placeholder="e.g., john@example.com"
          />
        </div>

        <div class="col-md-4">
          <label for="userRole" class="form-label">Role</label>
          <select id="userRole" class="form-select">
            <option value="">Select role</option>
            <option value="admin">Admin</option>
            <option value="teacher">Teacher</option>
            <option value="student">Student</option>
          </select>
        </div>
      </div>

      <!-- Buttons -->
      <div class="mt-3 d-flex align-items-center flex-wrap gap-2">
        <button id="addUser" type="button" class="btn btn-success mt-2">
          Add User
        </button>

        <button id="updateUser" type="button" class="btn btn-primary mt-2" disabled>
          Update User
        </button>

        <button id="resetUserForm" type="button" class="btn btn-outline-secondary mt-2">
          Reset
        </button>

        <small id="userFormMsg" class="text-muted mt-2"></small>
      </div>

      <hr class="my-4" />

      <!-- User List -->
      <section class="card p-3 mt-4">
        <h3 class="h6 mb-3">Users</h3>
        <div id="userList" class="small"></div>
      </section>

    </form>
  </section>

  <div class="alert alert-info mt-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
    <div>
      <strong>Hint:</strong> Click on a user to edit or delete them.
    </div>
  </div>

</section>
