<section id="view-manage-exams" class="view d-none">
    <section class="card p-3">
      <h2>Manage Exams</h2>
  
      <label for="mxSubject">Select Subject</label>
      <select id="mxSubject" class="form-select mb-2"></select>
  
      <h3 class="h6 mt-3">Select Details to Edit Exam</h3>
      <div id="mxExamList" class="mt-2"></div>

      
  
      <hr class="my-4" />
  
      <h3 class="h6">Exam Details</h3>
      <div id="mxExamDetail" class="small text-muted">
        Select an exam and click “Details”.
      </div>


      <section id="mxAddSection" class="card p-3 mt-4 d-none">
        <h3 class="h6 mb-3">Add Questions into selected Exam</h3>
      
        <!-- Filter -->
        <div class="row g-2">
          <div class="col-md-4">
            <label class="form-label" for="mxDifficulty">Difficulty</label>
            <select id="mxDifficulty" class="form-select">
              <option value="">All</option>
              <option value="easy">easy</option>
              <option value="medium">medium</option>
              <option value="hard">hard</option>
            </select>
          </div>
      
          <div class="col-md-4">
            <label class="form-label" for="mxType">Type</label>
            <select id="mxType" class="form-select">
              <option value="">All</option>
              <option value="SCQ">SCQ</option>
              <option value="MCQ">MCQ</option>
              <option value="TF">TF</option>
              <option value="SA">SA</option>
              <option value="LA">LA</option>
            </select>
          </div>
      
          <div class="col-md-4">
            <label class="form-label" for="mxSearch">Search</label>
            <input id="mxSearch" class="form-control" />
          </div>
        </div>
      
        <div class="mt-3 d-flex gap-2 flex-wrap">
          <button id="mxApplyFilters" class="btn btn-sm btn-success">Search</button>
          <button id="mxResetFilters" class="btn btn-sm btn-outline-secondary">Reset</button>
          <button id="mxPrev" class="btn btn-sm btn-outline-secondary">Prev</button>
          <button id="mxNext" class="btn btn-sm btn-outline-secondary">Next</button>
          <small id="mxInfo" class="text-muted"></small>
        </div>
      
        <div id="mxPoolList" class="mt-3"></div>
      </section>
      
      

    </section>
  </section>
